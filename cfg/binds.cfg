// 초기화
// ------------------------------------------------------------
unbindall


// 사용자 정의 키
// ------------------------------------------------------------
bind "F5" "scripted_user_func kill"             // 킬 단축키
bind "F9" "scripted_user_func timescale,1"      // 타임스케일 1배
bind "F10" "scripted_user_func timescale,10"    // 타임스케일 10배
bind "F11" "scripted_user_func timescale,5"     // 타임스케일 5배
bind "F12" "disconnect"     // 연결 끊기

bind "=" "show_menu menu"   // Admin Menu 표시

bind "TAB" "+scoregraph"    // 왼쪽 패널과 그래프 표시
alias +scoregraph "+showscores; net_graph 4; net_graphpos 1"
alias -scoregraph "-showscores; net_graph 1; net_graphpos 2"
bind "q" "slot1;slot3;slot4;slot5; wait 12; slot2"          // 스왑
bind "t" "go_away_from_keyboard; c_thirdpersonshoulder 0"   // 유휴
bind "o" "say /ptg 10"      // 플레이어 현재 위치 알림
bind "p" "say /p"           // 플레이어 현재 위치 알림
bind "\" "l4n_menu"         // L4N 메뉴

bind "g" "throw_say_cmd"    // 아이템 던지기

bind "UPARROW" "throw_toggle"     // 던지기 명령 토글
alias throw_say_cmd "say /throw"
alias throw_nes_cmd "setinfo nescmd throwitem; taunt; nescmd 0"
alias throw_say "bind g throw_say_cmd; alias throw_toggle throw_nes; echo throw: say /throw"
alias throw_nes "bind g throw_nes_cmd; alias throw_toggle throw_say; echo throw: nescmd throwitem"
alias throw_toggle "throw_nes"



// 보컬라이저 키
// ------------------------------------------------------------
bind "F4" "+mouse_menu Characters"

bind "z" "+mouse_menu Orders"
bind "x" "+mouse_menu QA"
bind "c" "+mouse_menu Reactions"

bind "v" "+mouse_menu Misc1"
bind "b" "+mouse_menu Misc2"

bind "h" "+mouse_menu Events"

bind "j" "+ch1; alias -ch1 -mouse_menu"
bind "m" "+ch2; alias -ch2 -mouse_menu"
bind "k" "+ch3; alias -ch3 -mouse_menu"
bind "," "+ch4; alias -ch4 -mouse_menu"
bind "l" "+ch5; alias -ch5 -mouse_menu"
bind "." "+ch6; alias -ch6 -mouse_menu"
bind "SEMICOLON" "+ch7; alias -ch7 -mouse_menu"
bind "/" "+ch8; alias -ch8 -mouse_menu"


// NULL-CANCELLING MOVEMENT + DSP
// ------------------------------------------------------------
bind "W" "+mfwd"
bind "A" "+mleft"
bind "S" "+mback"
bind "D" "+mright"

alias +mfwd "dsp_volume 0;-back;+forward;alias checkfwd +forward"
alias +mback "dsp_volume 0;-forward;+back;alias checkback +back"
alias +mleft "dsp_volume 0;-moveright;+moveleft;alias checkleft +moveleft"
alias +mright "dsp_volume 0;-moveleft;+moveright;alias checkright +moveright"
alias -mfwd "-forward;checkback;alias checkfwd none"
alias -mback "-back;checkfwd;alias checkback none"
alias -mleft "-moveleft;checkright;alias checkleft none"
alias -mright "-moveright;checkleft;alias checkright none"
alias checkfwd "none"
alias checkback "none"
alias checkleft "none"
alias checkright "none"
alias none ""


// 기본 키
// ------------------------------------------------------------
bind "ESCAPE" "cancelselect"
bind "F1" "Vote Yes"
bind "F2" "Vote No"

bind "`" "toggleconsole"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "0" "slot10"
bind "-" "chooseteam"

bind "e" "+use"
bind "r" "+reload"
bind "y" "impulse 201"  // 스프레이

bind "CAPSLOCK" "thirdpersonshoulder"   // 3인칭
bind "f" "impulse 100"
bind "ENTER" "messagemode"

bind "SHIFT" "+speed"
bind "RSHIFT" "messagemode2"    // 팀채팅

bind "CTRL" "+duck"
bind "SPACE" "+jump"

bind "MOUSE1" "+attack; r_cleardecals; cl_destroy_ragdolls"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "+zoom"
bind "MWHEELDOWN" "invnext"
bind "MWHEELUP" "invprev"